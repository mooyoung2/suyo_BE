spring:
  application:
    name: suyo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

app:
  cors:
    # 프론트 개발서버 포트가 정해지면 여기 기본값을 맞추거나, 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 실제 도메인을 추가한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8081}

management:
  endpoint:
    health:
      probes:
        enabled: true
